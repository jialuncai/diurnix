name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked release environment
        run: |
          uv venv --python 3.11 .venv
          uv sync --locked --extra dev --extra torch --python .venv/bin/python --index-strategy unsafe-best-match
      - name: Validate and build
        run: make release
      - name: Smoke-check wheel installation
        run: .venv/bin/python scripts/check_package.py
      - name: Publish GitHub release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
